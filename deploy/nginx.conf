# Cloud Run listens on 8080. Serve the deck at / and cache media assets.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index deck.html;

  # deck.html is the entrypoint; unknown paths fall back to it.
  location / {
    try_files $uri $uri/ /deck.html;
  }

  # Videos, logos, images — safe to cache hard, they're content-hashed by name.
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml;
}
